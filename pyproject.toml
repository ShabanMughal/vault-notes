[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-notes"
version = "1.0.0"
description = "A fast, encrypted notes and password app for Windows."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shaban Mughal" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8"]

[project.gui-scripts]
vault-notes = "vault_notes.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
